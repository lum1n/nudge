# The checks every change passes: on pushes to main, on pull requests, and (through
# workflow_call) before release.yml bundles and signs a tag.
#   - TypeScript: typecheck, lint and test (`pnpm check`), and the push relay's bundle,
#   - the Rust client: `cargo test`, its server tests against the built packages,
#   - the Android app: a debug build, without the native libraries (cargo-ndk),
#   - the Apple app: an iOS simulator build with Xcode 27.1, the only place the SwiftUI compiles.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MCP servers' programs run in bubblewrap, which needs the user namespaces Ubuntu 24.04
      # keeps from unprivileged programs by default.
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm check
      - run: pnpm -C packages/relay bundle

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The client's server tests run the faux server on the built packages; without them they skip.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: cargo test --locked
        working-directory: clients/rust

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v6
      # The bindings come from a host build of nudge-ffi.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: ./gradlew :app:assembleDebug -Pnudge.native=false
        working-directory: apps/android

  apple:
    runs-on: macos-26
    # GitHub's macos-26 runners stop at Xcode 26.6, and the app needs 27.1 (#57). Until they have
    # it, a failure here shows but doesn't hold back a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: brew install xcodegen
      - run: clients/apple/scripts/build.sh --xcframework
      - run: xcodegen generate --quiet
        working-directory: apps/apple
      # Unsigned: CI has no team. The simulator build covers the iPhone Duo's APIs.
      - run: >-
          xcodebuild build -project Nudge.xcodeproj -scheme Nudge-iOS
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        working-directory: apps/apple
