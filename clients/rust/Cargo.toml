[workspace]
resolver = "3"
members = ["nudge-protocol", "nudge-client", "nudge-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
nudge-protocol = { path = "nudge-protocol" }
nudge-client = { path = "nudge-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.10.3"
url = "2"
# Opening pushes sealed for the device (see extensions/push/src/device-seal.ts).
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hkdf = "0.12.4"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
base64 = "0.22.1"
uniffi = "0.32.2"
jsonschema = { version = "0.58.6", default-features = false }
# Signing in to exe.dev over SSH, and reading its screen.
russh = { version = "0.64.1", default-features = false, features = ["aws-lc-rs", "rsa"] }
vt100 = "0.16.2"

# The library ships inside apps and wheels. Symbols stay: uniffi-bindgen reads its metadata from them.
[profile.release]
lto = "thin"
strip = "debuginfo"
