[workspace]
resolver = "3"
members = ["nudge-protocol", "nudge-client", "nudge-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
nudge-protocol = { path = "nudge-protocol" }
nudge-client = { path = "nudge-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.10.3"
url = "2"
uniffi = "0.32.2"
jsonschema = { version = "0.58.6", default-features = false }
