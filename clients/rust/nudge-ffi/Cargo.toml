[package]
name = "nudge-ffi"
description = "UniFFI bindings of nudge-client, for Swift, Kotlin and Python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "nudge_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
# Speech to text on the device, with whisper.cpp (`nudge-speech`); `metal` for Apple's GPUs.
speech = ["dep:nudge-speech"]
metal = ["speech", "nudge-speech/metal"]

[dependencies]
nudge-client.workspace = true
nudge-speech = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true
