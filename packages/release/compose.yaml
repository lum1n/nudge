# docker compose up -d, then: docker compose logs nudge, and open the setup link it printed
# (with this machine's address instead of 127.0.0.1).
services:
  nudge:
    image: ghcr.io/lum1n/nudge:stable
    # For the terminal extension (shell commands) and the desktop extension (apps on a virtual
    # desktop), the security_opt lines below; for the desktop, also the image with its apps and
    # services. Both run in a bubblewrap sandbox, which keeps them from Nudge's data, and Docker
    # allows that only with these three loosened:
    # seccomp (unshare, mount), AppArmor (mount) and the masked /proc paths (bubblewrap mounts a
    # /proc of the sandbox's own). The container still runs as an unprivileged user without added
    # capabilities. `docker compose exec nudge nudge doctor` says whether the sandbox works. The
    # terminal's commands get the internet (its "network" setting) through slirp4netns, which also
    # needs the tun device.
    # image: ghcr.io/lum1n/nudge:stable-desktop
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    #   - systempaths=unconfined
    # devices:
    #   - /dev/net/tun
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - nudge:/data
volumes:
  nudge:
