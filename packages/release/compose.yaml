# docker compose up -d, then: docker compose logs nudge, and open the setup link it printed
# (with this machine's address instead of 127.0.0.1).
services:
  nudge:
    image: ghcr.io/lum1n/nudge:stable
    # For the desktop extension (apps the assistant uses on a virtual desktop), the image with its
    # apps and services instead, and the lines below. It runs the apps in a bubblewrap sandbox,
    # which keeps them from Nudge's data, and Docker allows that only with these three loosened:
    # seccomp (unshare, mount), AppArmor (mount) and the masked /proc paths (bubblewrap mounts a
    # /proc of the sandbox's own). The container still runs as an unprivileged user without added
    # capabilities. `docker compose exec nudge nudge doctor` says whether the sandbox works.
    # image: ghcr.io/lum1n/nudge:stable-desktop
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    #   - systempaths=unconfined
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - nudge:/data
volumes:
  nudge:
